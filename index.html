  <div id="map"></div>

  <script>
    /*******************************************************
     * Config
     *******************************************************/
    const ROUTE_BASE_URL = "https://bomi87.github.io/FLIGHT_MAP/live/";
    const FAA_APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxJHTvujHAaWbSBO0Z5lEvShfSAIKuNi4jeKrQCm7D3dy9Au8uaix0aPhzV9g43ojOFhw/exec";

    const ROUTE_REFERENCE_LON = -100;

    const POPUP_OPTIONS = {
      maxWidth: 300,
      autoPan: true
    };

    /*******************************************************
     * Map
     *******************************************************/
const map = L.map("map", {
  zoomControl: false,
  preferCanvas: true,
  worldCopyJump: false
}).setView([39.5, -98.5], window.innerWidth <= 767 ? 3 : 4);
    const streetMap = L.tileLayer(
      "https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png",
      {
        maxZoom: 12,
        attribution: "&copy; OpenStreetMap &copy; CARTO"
      }
    ).addTo(map);

    const satelliteMap = L.tileLayer(
      "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
      {
        maxZoom: 12,
        attribution: "Tiles &copy; Esri"
      }
    );

    L.control.layers(
      {
        "Street Map": streetMap,
        "Satellite": satelliteMap
      },
      null,
      {
        position: "bottomright",
        collapsed: true
      }
    ).addTo(map);

    const artccGroup = L.featureGroup().addTo(map);
    const routeLayer = L.featureGroup().addTo(map);

    let selectedLayer = null;
    let selectedIdent = "";
    let currentRouteName = "";

let allAdvisoriesCache = [];
let artccLayerIndex = {};
let facilityAdvisoryMap = {};
let airportAdvisoryMap = {};

let advisoryCacheLoadedAt = 0;
let advisoryCacheDate = "";
const ADVISORY_CACHE_TTL_MS = 5 * 60 * 1000; // 5분

let isAllAdvisoryLoading = false;
    let previousAdvisoryBoxHtml = "";
let isAdvisoryDetailOpen = false;

 function isAdvisoryCacheValid() {
  if (!allAdvisoriesCache || !allAdvisoriesCache.length) return false;
  if (!advisoryCacheLoadedAt) return false;
  if (advisoryCacheDate !== getDateValue()) return false;

  return Date.now() - advisoryCacheLoadedAt < ADVISORY_CACHE_TTL_MS;
}

    /*******************************************************
     * Basic Utils
     *******************************************************/
    function escapeHtml(str) {
      return String(str || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function cleanText(s) {
      return String(s || "")
        .replace(/\r/g, "\n")
        .replace(/[ \t]+/g, " ")
        .replace(/\n[ \t]+/g, "\n")
        .replace(/[ \t]+\n/g, "\n")
        .replace(/\n{3,}/g, "\n\n")
        .trim();
    }

    function textOfFirst(parent, tagName) {
      const node = parent.getElementsByTagName(tagName)[0];
      return node ? node.textContent.trim() : "";
    }

    function getDirectChild(parent, tagName) {
      for (const node of parent.children || []) {
        if (node.tagName === tagName) return node;
      }
      return null;
    }

    function parseXml(text) {
      return new DOMParser().parseFromString(text, "text/xml");
    }

    function buildPopupHtml(title, descriptionHtml, extraRows = []) {
      let html = `<div class="popup-body">`;

      if (title) {
        html += `<div class="popup-title">${escapeHtml(title)}</div>`;
      }

      if (descriptionHtml) {
        html += `<div class="popup-section">${descriptionHtml}</div>`;
      }

      if (extraRows && extraRows.length) {
        html += `<div class="popup-section"><table>`;
        extraRows.forEach(row => {
          html += `<tr><td>${escapeHtml(row.key)}</td><td>${row.value}</td></tr>`;
        });
        html += `</table></div>`;
      }

      html += `</div>`;
      return html;
    }

    /*******************************************************
     * Highlight
     *******************************************************/
    function highlightTerms(text, terms) {
      let html = escapeHtml(text || "");

      const cleanTerms = Array.from(new Set((terms || [])
        .map(t => String(t || "").trim().toUpperCase())
        .filter(Boolean)
      ));

      cleanTerms.forEach(term => {
        const escaped = term.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
        const re = new RegExp("(^|[^A-Z0-9])(" + escaped + ")([^A-Z0-9]|$)", "gi");

        html = html.replace(re, function(match, p1, p2, p3) {
          return p1 + "<span class='highlight-code'>" + p2 + "</span>" + p3;
        });
      });

      return html;
    }

    /*******************************************************
     * Anti-Meridian Helpers
     *******************************************************/
    function wrapLon180(lon) {
      let x = Number(lon);
      if (!isFinite(x)) return lon;

      while (x <= -180) x += 360;
      while (x > 180) x -= 360;

      return x;
    }

    function shiftLonNearReference(lon, referenceLon) {
      let x = wrapLon180(lon);

      if (!isFinite(referenceLon)) return x;

      while (x - referenceLon > 180) x -= 360;
      while (x - referenceLon < -180) x += 360;

      return x;
    }

    function unwrapLonNext(prevLon, currentLon) {
      let x = wrapLon180(currentLon);

      while (x - prevLon > 180) x -= 360;
      while (x - prevLon < -180) x += 360;

      return x;
    }

    function unwrapCoordSequence(coords, referenceLon) {
      if (!Array.isArray(coords) || !coords.length) return [];

      const firstLon = shiftLonNearReference(coords[0].lon, referenceLon);
      const result = [[coords[0].lat, firstLon]];
      let prevLon = firstLon;

      for (let i = 1; i < coords.length; i++) {
        const nextLon = unwrapLonNext(prevLon, coords[i].lon);
        result.push([coords[i].lat, nextLon]);
        prevLon = nextLon;
      }

      return result;
    }

    function toRenderLatLng(lat, lon) {
      return [lat, shiftLonNearReference(lon, ROUTE_REFERENCE_LON)];
    }
function getDefaultMapZoom() {
  return window.innerWidth <= 767 ? 3 : 4;
}
    /*******************************************************
     * FAA Advisory
     *******************************************************/
function getTodayUtcDateValue() {
  return getUtcDateValueByOffset(0);
}

function getYesterdayUtcDateValue() {
  return getUtcDateValueByOffset(-1);
}

function setDefaultAdvisoryDate() {
  const input = document.getElementById("dateInput");

  if (!input.value) {
    input.value = getTodayUtcDateValue();
  }
}
    function getUtcDateValueByOffset(daysOffset) {
  const d = new Date();
  d.setUTCDate(d.getUTCDate() + daysOffset);
  return d.toISOString().slice(0, 10);
}

function setDateInputValue(dateValue) {
  document.getElementById("dateInput").value = dateValue;
}
    function getDateValue() {
  return document.getElementById("dateInput").value || getTodayUtcDateValue();
}

    function buildFaaAdvisoryListUrl(date) {
      return (
        "https://www.fly.faa.gov/adv/adv_list" +
        "?whichAdvisories=ATCSCC" +
        "&advisoryCategory=All" +
        "&date=" + encodeURIComponent(date) +
        "&airflow=true&_airflow=on" +
        "&ctop=true&_ctop=on" +
        "&gStop=true&_gStop=on" +
        "&gDelay=true&_gDelay=on" +
        "&route=true&_route=on" +
        "&other=true&_other=on"
      );
    }

function updateFaaLink() {
  const fullLink = document.getElementById("faaFullListLink");
  const date = getDateValue();

  fullLink.href = buildFaaAdvisoryListUrl(date);
}

  

async function loadAllAdvisoriesForDate() {
  if (isAllAdvisoryLoading) return;

  isAllAdvisoryLoading = true;

  const date = getDateValue();
  const box = document.getElementById("airportRestrictionList");

  if (!FAA_APPS_SCRIPT_URL || FAA_APPS_SCRIPT_URL.includes("여기에_")) {
    box.innerHTML = "Apps Script URL 미설정.";
    isAllAdvisoryLoading = false;
    return;
  }

  box.innerHTML = "Advisory 전체 조회 중...";

  const url =
    FAA_APPS_SCRIPT_URL +
    "?date=" + encodeURIComponent(date) +
    "&includeDetails=true";

  try {
    const res = await fetch(url, { cache: "no-store" });
    const data = await res.json();

    if (!data.ok) {
      throw new Error(data.error || "Apps Script error");
    }

    allAdvisoriesCache = data.advisories || [];

    const todayUtc = getTodayUtcDateValue();
    const yesterdayUtc = getYesterdayUtcDateValue();

    // 오늘 UTC 조회 결과가 0개면 어제 UTC로 자동 재조회
    if (allAdvisoriesCache.length === 0 && date === todayUtc) {
      setDateInputValue(yesterdayUtc);
      updateFaaLink();

      box.innerHTML = "오늘 UTC Advisory 없음. 어제 UTC 날짜로 재조회 중...";

      isAllAdvisoryLoading = false; // 중요: 재조회 전에 false로 풀어줘야 함
      return loadAllAdvisoriesForDate();
    }

advisoryCacheLoadedAt = Date.now();
advisoryCacheDate = getDateValue();

buildFacilityAdvisoryMap();
    buildAirportAdvisoryMap();
    updateArtccAdvisoryColors();
    renderAirportRestrictionList();

    // 선택된 ARTCC가 있으면, 새로 받은 캐시 기준으로 다시 표시
    if (selectedIdent) {
      renderAdvisoriesForFacilityFromCache(selectedIdent);
    }

  } catch (err) {
    console.error(err);
    box.innerHTML = "Advisory 전체 조회 실패: " + escapeHtml(err.message);

  } finally {
    isAllAdvisoryLoading = false;
  }
}

    function buildFacilityAdvisoryMap() {
      facilityAdvisoryMap = {};

      allAdvisoriesCache.forEach(a => {
        // 중요: 지도 색칠은 CONTROL ELEMENT 기준만 사용
        (a.controlFacilityCodes || []).forEach(code => {
          if (!facilityAdvisoryMap[code]) {
            facilityAdvisoryMap[code] = [];
          }
          facilityAdvisoryMap[code].push(a);
        });
      });
    }

    function buildAirportAdvisoryMap() {
      airportAdvisoryMap = {};

      allAdvisoriesCache.forEach(a => {
        (a.airportCodes || []).forEach(ap => {
          if (!airportAdvisoryMap[ap]) {
            airportAdvisoryMap[ap] = [];
          }
          airportAdvisoryMap[ap].push(a);
        });
      });
    }

    function updateArtccAdvisoryColors() {
      Object.keys(artccLayerIndex).forEach(code => {
        const layer = artccLayerIndex[code];
        if (!layer || !layer.setStyle) return;

        if (selectedIdent && code === selectedIdent) {
          layer.setStyle(getArtccStyle("selected"));
          return;
        }

        if (facilityAdvisoryMap[code] && facilityAdvisoryMap[code].length > 0) {
          layer.setStyle(getArtccStyle("hasAdvisory"));
        } else {
          layer.setStyle(getArtccStyle("normal"));
        }
      });
    }

    function renderAirportRestrictionList() {
      const box = document.getElementById("airportRestrictionList");

      const airports = Object.keys(airportAdvisoryMap).sort();

      if (!airports.length) {
        box.innerHTML = "영향 공항 없음";
        return;
      }

      box.innerHTML = airports.map(ap => {
        const list = airportAdvisoryMap[ap] || [];
        const advNums = list.map(a => "ADVZY " + a.advn).join(", ");

        return `
          <div class="airport-item" onclick="showAirportAdvisories('${escapeHtml(ap)}')">
            <b>${escapeHtml(ap)}</b><br>
            <span style="color:#6b7280;">${escapeHtml(advNums)}</span>
          </div>
        `;
      }).join("");
    }

    function showAirportAdvisories(airportCode) {
      const ap = String(airportCode || "").toUpperCase();
      const box = document.getElementById("advisoryBox");

      const matches = airportAdvisoryMap[ap] || [];

      if (!matches.length) {
        box.innerHTML = ap + " 관련 Advisory 없음";
        return;
      }

  box.innerHTML = `
  <div class="advisory-item">
    <b>${escapeHtml(ap)} 관련 Advisory</b>
    <span style="color:#6b7280; font-size:11px; margin-left:6px;">(Times in UTC)</span>
  </div>
` + matches.map(a => {
        const terms = Array.from(new Set([
          ap,
          ...(a.controlFacilityCodes || []),
          ...(a.facilityCodes || []),
          ...(a.airportCodes || [])
        ]));

        return `
          <div class="advisory-item">
            <b>ADVZY ${escapeHtml(a.advn)}</b><br>
            ${highlightTerms(a.title || "", terms)}<br>
            ${a.controlElement ? "Control: " + highlightTerms(a.controlElement, terms) + "<br>" : ""}
            ${a.sendTime ? "Send: " + escapeHtml(a.sendTime) + "<br>" : ""}
            ${a.eventTime ? "Event: " + highlightTerms(a.eventTime, terms) + "<br>" : ""}

    /*******************************************************
     * KML Style Parser
     *******************************************************/
    function kmlColorToCss(kmlColor, fallbackColor, fallbackOpacity) {
      if (!kmlColor || typeof kmlColor !== "string") {
        return { color: fallbackColor, opacity: fallbackOpacity };
      }

      const s = kmlColor.trim().replace("#", "");
      if (s.length !== 8) {
        return { color: fallbackColor, opacity: fallbackOpacity };
      }

      const aa = s.substring(0, 2);
      const bb = s.substring(2, 4);
      const gg = s.substring(4, 6);
      const rr = s.substring(6, 8);

      const opacity = parseInt(aa, 16) / 255;
      const color = "#" + rr + gg + bb;

      return {
        color: color,
        opacity: isNaN(opacity) ? fallbackOpacity : opacity
      };
    }

    function parseStyleNode(styleNode) {
      if (!styleNode) return {};

      const lineStyleNode = styleNode.getElementsByTagName("LineStyle")[0];
      const polyStyleNode = styleNode.getElementsByTagName("PolyStyle")[0];
      const labelStyleNode = styleNode.getElementsByTagName("LabelStyle")[0];
      const iconStyleNode = styleNode.getElementsByTagName("IconStyle")[0];

      const style = {};

      if (lineStyleNode) {
        style.lineColor = textOfFirst(lineStyleNode, "color");
        const width = parseFloat(textOfFirst(lineStyleNode, "width"));
        style.lineWidth = Number.isFinite(width) ? width : 4;
      }

      if (polyStyleNode) {
        style.polyColor = textOfFirst(polyStyleNode, "color");
        const fillText = textOfFirst(polyStyleNode, "fill");
        const outlineText = textOfFirst(polyStyleNode, "outline");
        style.fill = fillText === "" ? true : fillText !== "0";
        style.outline = outlineText === "" ? true : outlineText !== "0";
      }

      if (labelStyleNode) {
        style.labelColor = textOfFirst(labelStyleNode, "color");
        const labelScale = parseFloat(textOfFirst(labelStyleNode, "scale"));
        style.labelScale = Number.isFinite(labelScale) ? labelScale : 1;
      }

      if (iconStyleNode) {
        style.iconColor = textOfFirst(iconStyleNode, "color");
        const iconScale = parseFloat(textOfFirst(iconStyleNode, "scale"));
        style.iconScale = Number.isFinite(iconScale) ? iconScale : 1;

        const iconNode = iconStyleNode.getElementsByTagName("Icon")[0];
        if (iconNode) {
          style.iconHref = textOfFirst(iconNode, "href");
        }
      }

      return style;
    }

    function mergeStyles(baseStyle, overrideStyle) {
      return {
        ...(baseStyle || {}),
        ...(overrideStyle || {})
      };
    }

    function buildStyleIndex(xml) {
      const styleMap = {};
      const styleNodes = Array.from(xml.getElementsByTagName("Style"));

      styleNodes.forEach(styleNode => {
        const id = styleNode.getAttribute("id");
        if (!id) return;
        styleMap["#" + id] = parseStyleNode(styleNode);
      });

      return styleMap;
    }

    function buildStyleMapIndex(xml) {
      const styleMapIndex = {};
      const styleMapNodes = Array.from(xml.getElementsByTagName("StyleMap"));

      styleMapNodes.forEach(node => {
        const id = node.getAttribute("id");
        if (!id) return;

        const pairs = Array.from(node.getElementsByTagName("Pair"));
        let normalUrl = "";

        pairs.forEach(pair => {
          const key = textOfFirst(pair, "key");
          const styleUrl = textOfFirst(pair, "styleUrl");
          if (key === "normal" && styleUrl) {
            normalUrl = styleUrl;
          }
        });

        if (normalUrl) {
          styleMapIndex["#" + id] = normalUrl;
        }
      });

      return styleMapIndex;
    }

    function buildExtendedDataRows(placemark) {
      const rows = [];

      const simpleDatas = placemark.getElementsByTagName("SimpleData");
      Array.from(simpleDatas).forEach(node => {
        const key = node.getAttribute("name") || "Data";
        const value = escapeHtml(node.textContent || "");
        if (value) rows.push({ key, value });
      });

      const datas = placemark.getElementsByTagName("Data");
      Array.from(datas).forEach(node => {
        const key = node.getAttribute("name") || "Data";
        const valueNode = node.getElementsByTagName("value")[0];
        const value = valueNode ? escapeHtml(valueNode.textContent || "") : "";
        if (value) rows.push({ key, value });
      });

      return rows;
    }

    function resolveIconUrl(href) {
      if (!href) return "";
      if (/^https?:\/\//i.test(href)) return href;
      if (href.startsWith("/")) return "https://bomi87.github.io" + href;
      return ROUTE_BASE_URL + href;
    }

    /*******************************************************
     * KML Feature Parser
     *******************************************************/
    function parseCoordinates(coordText) {
      if (!coordText) return [];

      return coordText
        .trim()
        .split(/\s+/)
        .map(row => {
          const parts = row.split(",");
          const lon = parseFloat(parts[0]);
          const lat = parseFloat(parts[1]);
          const alt = parts.length > 2 ? parseFloat(parts[2]) : null;

          return { lat, lon, alt };
        })
        .filter(p =>
          isFinite(p.lat) &&
          isFinite(p.lon) &&
          Math.abs(p.lat) <= 90 &&
          Math.abs(p.lon) <= 180 &&
          !(Math.abs(p.lat) < 0.000001 && Math.abs(p.lon) < 0.000001)
        );
    }

    function extractKMLFeatures(kmlText) {
      const xml = parseXml(kmlText);
      const styleIndex = buildStyleIndex(xml);
      const styleMapIndex = buildStyleMapIndex(xml);
      const placemarks = Array.from(xml.getElementsByTagName("Placemark"));

      const features = [];

      placemarks.forEach(pm => {
        const name = textOfFirst(pm, "name");
        const description = textOfFirst(pm, "description");

        let styleUrl = textOfFirst(pm, "styleUrl");
        if (styleMapIndex[styleUrl]) {
          styleUrl = styleMapIndex[styleUrl];
        }

        const sharedStyle = styleIndex[styleUrl] || {};
        const inlineStyleNode = getDirectChild(pm, "Style");
        const inlineStyle = parseStyleNode(inlineStyleNode);
        const style = mergeStyles(sharedStyle, inlineStyle);

        const extraRows = buildExtendedDataRows(pm);

        const pointNodes = pm.getElementsByTagName("Point");
        const lineNodes = pm.getElementsByTagName("LineString");
        const polyNodes = pm.getElementsByTagName("Polygon");

        Array.from(pointNodes).forEach(node => {
          const coords = parseCoordinates(textOfFirst(node, "coordinates"));
          if (coords.length) {
            features.push({
              type: "Point",
              name,
              description,
              extraRows,
              style,
              coords: coords[0]
            });
          }
        });

        Array.from(lineNodes).forEach(node => {
          const coords = parseCoordinates(textOfFirst(node, "coordinates"));
          if (coords.length >= 2) {
            features.push({
              type: "LineString",
              name,
              description,
              extraRows,
              style,
              coords
            });
          }
        });

        Array.from(polyNodes).forEach(node => {
          const rings = [];

          const outerNodes = Array.from(node.getElementsByTagName("outerBoundaryIs"));
          outerNodes.forEach(outer => {
            const outerCoords = parseCoordinates(textOfFirst(outer, "coordinates"));
            if (outerCoords.length >= 3) rings.push(outerCoords);
          });

          const innerNodes = Array.from(node.getElementsByTagName("innerBoundaryIs"));
          innerNodes.forEach(inner => {
            const innerCoords = parseCoordinates(textOfFirst(inner, "coordinates"));
            if (innerCoords.length >= 3) rings.push(innerCoords);
          });

          if (rings.length) {
            features.push({
              type: "Polygon",
              name,
              description,
              extraRows,
              style,
              rings
            });
          }
        });
      });

      return features;
    }

    /*******************************************************
     * Route Drawing
     *******************************************************/
    function getLineStyle(feature) {
      return kmlColorToCss(feature.style.lineColor, "#FFD400", 1);
    }

    function getIconStyle(feature) {
      const rawColor =
        feature.style.iconColor ||
        feature.style.lineColor ||
        feature.style.labelColor ||
        "#ffff00";

      const base = kmlColorToCss(rawColor, "#ffff00", 1);
      const scale = Number(feature.style.iconScale || 1);

      return {
        color: base.color || "#ffff00",
        opacity: Number.isFinite(base.opacity) ? base.opacity : 1,
        scale: Number.isFinite(scale) && scale > 0 ? scale : 1,
        href: resolveIconUrl(feature.style.iconHref || "")
      };
    }

    function drawKMLLine(feature, aircraft) {
      const lineStyle = getLineStyle(feature);
      const weight = feature.style.lineWidth || 4;
      const latlngs = unwrapCoordSequence(feature.coords, ROUTE_REFERENCE_LON);

      const line = L.polyline(latlngs, {
        color: lineStyle.color,
        weight: weight,
        opacity: lineStyle.opacity
      }).addTo(routeLayer);

      if (feature.name || feature.description || feature.extraRows.length) {
        line.bindPopup(
          buildPopupHtml(
            feature.name || aircraft + " Route",
            feature.description || "",
            feature.extraRows || []
          ),
          POPUP_OPTIONS
        );
      }

      return line;
    }

    function drawKMLPoint(feature, aircraft, index, total) {
      const popupHtml = buildPopupHtml(
        feature.name || "Waypoint",
        feature.description || "",
        feature.extraRows || []
      );

      const latlng = toRenderLatLng(feature.coords.lat, feature.coords.lon);
      const iconStyle = getIconStyle(feature);

      let marker;

      if (iconStyle.href) {
        const iconSize = Math.max(10, Math.round(16 * iconStyle.scale));

        const customIcon = L.icon({
          iconUrl: iconStyle.href,
          iconSize: [iconSize, iconSize],
          iconAnchor: [iconSize / 2, iconSize / 2],
          popupAnchor: [0, -10]
        });

        marker = L.marker(latlng, {
          icon: customIcon,
          zIndexOffset: 2000
        }).addTo(routeLayer);
      } else {
        let fillColor = iconStyle.color || "#ffff00";

        if (index === 0) fillColor = "#22c55e";
        if (index === total - 1) fillColor = "#3b82f6";

        marker = L.circleMarker(latlng, {
          radius: Math.max(3, 4 * iconStyle.scale),
          color: "#111827",
          weight: 1,
          fillColor: fillColor,
          fillOpacity: iconStyle.opacity
        }).addTo(routeLayer);
      }

      marker.bindPopup(popupHtml, POPUP_OPTIONS);

      return marker;
    }

    function drawKMLPolygon(feature, aircraft) {
      const lineStyle = kmlColorToCss(feature.style.lineColor, "#00aa55", 0.9);
      const fillStyle = kmlColorToCss(feature.style.polyColor, "#00CC66", 0.25);

      const rings = feature.rings.map(ring => unwrapCoordSequence(ring, ROUTE_REFERENCE_LON));

      const polygon = L.polygon(rings, {
        color: lineStyle.color,
        opacity: feature.style.outline === false ? 0 : lineStyle.opacity,
        weight: feature.style.outline === false ? 0 : (feature.style.lineWidth || 2),
        fillColor: fillStyle.color,
        fillOpacity: feature.style.fill === false ? 0 : fillStyle.opacity
      }).addTo(routeLayer);

      if (feature.name || feature.description || feature.extraRows.length) {
        polygon.bindPopup(
          buildPopupHtml(
            feature.name || aircraft + " Polygon",
            feature.description || "",
            feature.extraRows || []
          ),
          POPUP_OPTIONS
        );
      }

      return polygon;
    }

    async function loadRouteByAircraft(aircraft) {
      try {
        currentRouteName = aircraft;
        document.getElementById("selectedRoute").textContent = aircraft;
    
        setActiveRouteButton(aircraft);

        routeLayer.clearLayers();

        const url = getRouteKmlUrl(aircraft);
        const res = await fetch(url, { cache: "no-store" });

        if (!res.ok) {
          throw new Error("KML load failed: " + res.status);
        }

        const kmlText = await res.text();
        const features = extractKMLFeatures(kmlText);

        if (!features.length) {
          throw new Error("KML 안에 유효한 feature가 없습니다.");
        }

        const lineFeatures = features.filter(f => f.type === "LineString");
        const pointFeatures = features.filter(f => f.type === "Point");
        const polygonFeatures = features.filter(f => f.type === "Polygon");

        lineFeatures.forEach(f => drawKMLLine(f, aircraft));
        polygonFeatures.forEach(f => drawKMLPolygon(f, aircraft));

        pointFeatures.forEach((f, idx) => {
          drawKMLPoint(f, aircraft, idx, pointFeatures.length);
        });

        map.setView([39.5, -98.5], getDefaultMapZoom());

 

      } catch (err) {
        console.error(err);

      }
    }
