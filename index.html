<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>FAA ARTCC Advisory Map</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    .top-panel {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 1000;
      width: 320px;
      max-width: calc(100vw - 24px);
      background: rgba(255, 255, 255, 0.96);
      border-radius: 12px;
      box-shadow: 0 3px 14px rgba(0,0,0,0.25);
      padding: 12px;
      font-size: 12px;
    }

    .title {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 10px;
      color: #111827;
    }

    .row {
      margin-bottom: 8px;
    }

    label {
      font-weight: 700;
      display: block;
      margin-bottom: 4px;
      color: #374151;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 7px 8px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 12px;
    }

    .selected-box {
      background: #f3f4f6;
      border-radius: 8px;
      padding: 8px;
      margin-top: 8px;
      line-height: 1.5;
    }

    .btn {
      display: block;
      width: 100%;
      box-sizing: border-box;
      margin-top: 8px;
      padding: 8px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
    }

    .btn:hover {
      background: #1d4ed8;
    }

    .route-btn-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-top: 8px;
    }

    .route-btn {
      border: none;
      border-radius: 8px;
      padding: 8px 4px;
      background: #111827;
      color: white;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .route-btn:hover {
      background: #374151;
    }

    .route-btn.active {
      background: #16a34a;
    }

    .clear-btn {
      width: 100%;
      border: none;
      border-radius: 8px;
      padding: 7px 4px;
      background: #6b7280;
      color: white;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 6px;
    }

    .clear-btn:hover {
      background: #4b5563;
    }

    .status {
      margin-top: 8px;
      font-size: 11px;
      color: #374151;
      line-height: 1.4;
    }

    .hint {
      color: #6b7280;
      font-size: 11px;
      margin-top: 8px;
      line-height: 1.4;
    }

    .artcc-label {
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      color: #ffffff;
      font-size: 12px;
      font-weight: 700;
      text-shadow:
        -1px -1px 0 #000,
         1px -1px 0 #000,
        -1px  1px 0 #000,
         1px  1px 0 #000,
         0 0 4px rgba(0,0,0,0.8);
    }

    .route-label {
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      color: #ffff00;
      font-size: 12px;
      font-weight: 700;
      text-shadow:
        -1px -1px 0 #000,
         1px -1px 0 #000,
        -1px  1px 0 #000,
         1px  1px 0 #000;
    }

    .leaflet-popup-content {
      font-size: 12px;
      line-height: 1.4;
    }

    @media (max-width: 767px) {
      .top-panel {
        width: 280px;
        font-size: 11px;
      }

      .title {
        font-size: 14px;
      }

      .artcc-label {
        font-size: 10px;
      }
    }
  </style>
</head>

<body>
  <div class="top-panel">
    <div class="title">FAA ARTCC Advisory Map</div>

    <div class="row">
      <label for="dateInput">Advisory Date</label>
      <input id="dateInput" type="date" value="2026-05-08" />
    </div>

    <label>Route Overlay</label>
    <div class="route-btn-row">
      <button id="btnHL8080" class="route-btn" onclick="loadRouteByAircraft('HL8080')">HL8080</button>
      <button id="btnHL8372" class="route-btn" onclick="loadRouteByAircraft('HL8372')">HL8372</button>
    </div>
    <button class="clear-btn" onclick="clearRoute()">Clear Route</button>

    <div class="selected-box">
      Selected ARTCC: <b id="selectedArtcc">-</b><br>
      Name: <span id="selectedName">-</span><br>
      Route: <b id="selectedRoute">-</b>
    </div>

    <a id="faaListLink" class="btn" href="#" target="_blank">
      Open FAA Advisory List
    </a>

    <div id="routeStatus" class="status">Route 미선택</div>

    <div class="hint">
      HL8080 또는 HL8372 버튼을 누르면 기존 FLIGHT_MAP의 KML 루트가 이 지도 위에 표시됨.
    </div>
  </div>

  <div id="map"></div>

  <script>
    const map = L.map("map", {
      zoomControl: true,
      preferCanvas: true
    }).setView([39.5, -98.5], 4);

    const streetMap = L.tileLayer(
      "https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png",
      {
        maxZoom: 12,
        attribution: "&copy; OpenStreetMap &copy; CARTO"
      }
    ).addTo(map);

    const satelliteMap = L.tileLayer(
      "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
      {
        maxZoom: 12,
        attribution: "Tiles &copy; Esri"
      }
    );

    L.control.layers(
      {
        "Street Map": streetMap,
        "Satellite": satelliteMap
      },
      null,
      {
        position: "topright",
        collapsed: false
      }
    ).addTo(map);

    const artccGroup = L.featureGroup().addTo(map);
    const routeLayer = L.featureGroup().addTo(map);

    let selectedLayer = null;
    let selectedIdent = "";
    let currentRouteName = "";

    const ROUTE_BASE_URL = "https://bomi87.github.io/FLIGHT_MAP/live/";

    function getDateValue() {
      return document.getElementById("dateInput").value || "2026-05-08";
    }

    function buildFaaAdvisoryListUrl(date) {
      return (
        "https://www.fly.faa.gov/adv/adv_list" +
        "?advisoryCategory=All" +
        "&whichAdvisories=Both" +
        "&date=" + encodeURIComponent(date) +
        "&airflow=true&_airflow=on" +
        "&ctop=true&_ctop=on" +
        "&gStop=true&_gStop=on" +
        "&gDelay=true&_gDelay=on" +
        "&route=true&_route=on" +
        "&other=true&_other=on"
      );
    }

    function getArtccStyle(isSelected) {
      return {
        color: isSelected ? "#ef4444" : "#6b7280",
        weight: isSelected ? 3 : 1.5,
        opacity: 0.95,
        fillColor: isSelected ? "#ef4444" : "#64748b",
        fillOpacity: isSelected ? 0.18 : 0.06
      };
    }

    function updateFaaLink() {
      const date = getDateValue();
      const link = document.getElementById("faaListLink");
      link.href = buildFaaAdvisoryListUrl(date);

      if (selectedIdent) {
        link.textContent = "Open FAA List - " + selectedIdent;
      } else {
        link.textContent = "Open FAA Advisory List";
      }
    }

    function selectArtcc(layer, feature) {
      const p = feature.properties || {};
      const ident = p.ident || p.facility || p.id || "";
      const name = p.name || ident;

      if (selectedLayer && selectedLayer.setStyle) {
        selectedLayer.setStyle(getArtccStyle(false));
      }

      selectedLayer = layer;
      selectedIdent = ident;

      layer.setStyle(getArtccStyle(true));
      layer.bringToFront();

      document.getElementById("selectedArtcc").textContent = ident || "-";
      document.getElementById("selectedName").textContent = name || "-";

      updateFaaLink();
    }

    async function loadArtccGeojson() {
      const res = await fetch("artcc.geojson?v=" + Date.now(), {
        cache: "no-store"
      });

      if (!res.ok) {
        throw new Error("artcc.geojson load failed");
      }

      const data = await res.json();

      const geoLayer = L.geoJSON(data, {
        style: function () {
          return getArtccStyle(false);
        },

        onEachFeature: function (feature, layer) {
          const p = feature.properties || {};
          const ident = p.ident || p.facility || p.id || "";
          const name = p.name || ident;

          layer.bindTooltip(ident, {
            permanent: true,
            direction: "center",
            className: "artcc-label",
            opacity: 1
          });

          layer.bindPopup(
            "<b>" + ident + "</b><br>" +
            name + "<br><br>" +
            "Click area to select."
          );

          layer.on("click", function () {
            selectArtcc(layer, feature);
          });

          layer.on("mouseover", function () {
            if (layer !== selectedLayer) {
              layer.setStyle({
                weight: 2.5,
                fillOpacity: 0.12
              });
            }
          });

          layer.on("mouseout", function () {
            if (layer !== selectedLayer) {
              layer.setStyle(getArtccStyle(false));
            }
          });
        }
      });

      geoLayer.addTo(artccGroup);

      const bounds = geoLayer.getBounds();
      if (bounds.isValid()) {
        map.fitBounds(bounds, { padding: [20, 20] });
      }
    }

    function parseCoordinates(coordText) {
      if (!coordText) return [];

      return coordText
        .trim()
        .split(/\s+/)
        .map(row => {
          const parts = row.split(",");
          const lon = parseFloat(parts[0]);
          const lat = parseFloat(parts[1]);
          const alt = parts.length > 2 ? parseFloat(parts[2]) : null;

          return { lat, lon, alt };
        })
        .filter(p =>
          isFinite(p.lat) &&
          isFinite(p.lon) &&
          Math.abs(p.lat) <= 90 &&
          Math.abs(p.lon) <= 180 &&
          !(Math.abs(p.lat) < 0.000001 && Math.abs(p.lon) < 0.000001)
        );
    }

    function parseKmlRoute(kmlText) {
      const xml = new DOMParser().parseFromString(kmlText, "text/xml");
      const lineNodes = Array.from(xml.getElementsByTagName("LineString"));
      const pointNodes = Array.from(xml.getElementsByTagName("Point"));

      const lines = [];
      const points = [];

      lineNodes.forEach(node => {
        const coordNode = node.getElementsByTagName("coordinates")[0];
        if (!coordNode) return;

        const coords = parseCoordinates(coordNode.textContent);
        if (coords.length >= 2) {
          lines.push(coords);
        }
      });

      pointNodes.forEach(node => {
        const coordNode = node.getElementsByTagName("coordinates")[0];
        if (!coordNode) return;

        const coords = parseCoordinates(coordNode.textContent);
        if (coords.length > 0) {
          points.push(coords[0]);
        }
      });

      return { lines, points };
    }

    function getRouteKmlUrl(aircraft) {
      return ROUTE_BASE_URL + aircraft + ".kml?v=" + Date.now();
    }

    function setActiveRouteButton(aircraft) {
      document.getElementById("btnHL8080").classList.remove("active");
      document.getElementById("btnHL8372").classList.remove("active");

      if (aircraft === "HL8080") {
        document.getElementById("btnHL8080").classList.add("active");
      }

      if (aircraft === "HL8372") {
        document.getElementById("btnHL8372").classList.add("active");
      }
    }

    async function loadRouteByAircraft(aircraft) {
      try {
        currentRouteName = aircraft;
        document.getElementById("selectedRoute").textContent = aircraft;
        document.getElementById("routeStatus").textContent = aircraft + " Route 로딩 중...";
        setActiveRouteButton(aircraft);

        routeLayer.clearLayers();

        const url = getRouteKmlUrl(aircraft);
        const res = await fetch(url, { cache: "no-store" });

        if (!res.ok) {
          throw new Error("KML load failed: " + res.status);
        }

        const kmlText = await res.text();
        const route = parseKmlRoute(kmlText);

        if (!route.lines.length && !route.points.length) {
          throw new Error("KML 안에 유효한 LineString 또는 Point가 없습니다.");
        }

        const boundsGroup = L.featureGroup();

        route.lines.forEach((lineCoords, idx) => {
          const latlngs = lineCoords.map(p => [p.lat, p.lon]);

          const line = L.polyline(latlngs, {
            color: "#ffd400",
            weight: 5,
            opacity: 0.95
          }).addTo(routeLayer);

          line.bindPopup(
            "<b>" + aircraft + "</b><br>" +
            "Route Line " + (idx + 1)
          );

          boundsGroup.addLayer(line);
        });

        route.points.forEach((p, idx) => {
          let fillColor = "#ffffff";

          if (idx === 0) fillColor = "#22c55e";
          if (idx === route.points.length - 1) fillColor = "#3b82f6";

          const marker = L.circleMarker([p.lat, p.lon], {
            radius: 4,
            color: "#111827",
            weight: 1,
            fillColor: fillColor,
            fillOpacity: 1
          }).addTo(routeLayer);

          marker.bindPopup(
            "<b>" + aircraft + "</b><br>" +
            "Route Point " + (idx + 1)
          );

          boundsGroup.addLayer(marker);
        });

        if (boundsGroup.getBounds().isValid()) {
          map.fitBounds(boundsGroup.getBounds(), {
            padding: [30, 30],
            maxZoom: 7
          });
        }

        document.getElementById("routeStatus").textContent =
          aircraft + " Route 표시 완료 / Lines: " +
          route.lines.length + " / Points: " + route.points.length;

      } catch (err) {
        console.error(err);
        document.getElementById("routeStatus").textContent =
          "Route 로드 실패: " + err.message;
      }
    }

    function clearRoute() {
      routeLayer.clearLayers();
      currentRouteName = "";
      document.getElementById("selectedRoute").textContent = "-";
      document.getElementById("routeStatus").textContent = "Route 미선택";
      document.getElementById("btnHL8080").classList.remove("active");
      document.getElementById("btnHL8372").classList.remove("active");
    }

    function autoLoadRouteFromUrl() {
      const params = new URLSearchParams(location.search);
      const route = String(params.get("route") || "").toUpperCase();

      if (route === "HL8080" || route === "HL8372") {
        loadRouteByAircraft(route);
      }
    }

    document.getElementById("dateInput").addEventListener("change", updateFaaLink);

    updateFaaLink();

    loadArtccGeojson()
      .then(() => {
        autoLoadRouteFromUrl();
      })
      .catch(err => {
        console.error(err);
        alert("ARTCC GeoJSON 로드 실패: " + err.message);
      });
  </script>
</body>
</html>
