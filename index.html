  }

  try {
    const airport = await geocodeAirportByIcao(code);

    if (!airport) {
      alert(code + " 공항 위치를 찾을 수 없습니다.");
      return;
    }

    const lat = Number(airport.lat);
    const lon = Number(airport.lon);

    if (!Number.isFinite(lat) || !Number.isFinite(lon)) {
      alert(code + " 공항 좌표가 올바르지 않습니다.");
      return;
    }

    airport.lat = lat;
    airport.lon = lon;

    // 검색 공항 좌표를 다른 지도 레이어와 동일한 world copy로 맞춤
    // 서경(-) 좌표가 왼쪽의 다른 world copy에 표시되는 현상 방지
    const airportLatLng =
      toNdbLatLngNearReference(lat, lon, GLOBAL_WORLD_REFERENCE_LON) || [lat, lon];

    map.setView(airportLatLng, 10, {
      animate: false
    });

    const hasNdbMarker = await showNdbMarkerIfExistsByIcao(code, airport);

    if (!hasNdbMarker) {
      L.popup({
        ...POPUP_OPTIONS,
        autoPan: false,
        keepInView: false
      })
        .setLatLng(airportLatLng)
        .setContent(
          "<b>" + escapeHtml(code) + "</b><br>" +
          escapeHtml(airport.name || code)
        )
        .openOn(map);

      // 일반 popup도 마지막에 다시 중앙 정렬
      map.setView(airportLatLng, 10, {
        animate: false
      });

      setTimeout(() => {
        map.setView(airportLatLng, 10, {
          animate: false
        });
      }, 50);
    }

  } catch (err) {
    console.error(err);
    alert(code + " 공항 검색 실패: " + err.message);
  }
}

    
function initNdbFixedControl() {
  const input = document.getElementById("ndbSearchInput");
  const button = document.getElementById("ndbToggleBtn");

  if (!input || !button) return;

  const isMobile = window.innerWidth <= 767;

  function applyNdbSearch(value) {
    const code = String(value || "")
      .toUpperCase()
      .replace(/[^A-Z0-9]/g, "")
      .slice(0, 4);

    input.value = code;

    if (ndbLoaded && ndbVisible) {
      filterNdbAirports(code);
    }

    fixMobileViewportAfterKeyboard();
  }

  if (isMobile) {
    input.readOnly = true;

    input.addEventListener("click", async function (e) {
      e.preventDefault();
      input.blur();

      const current = input.value || "";
      const value = prompt("Enter ICAO code", current);

      if (value === null) {
        fixMobileViewportAfterKeyboard();
        return;
      }

const code = String(value || "").trim().toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 4);

if (/^[A-Z]{4}$/.test(code)) {
  input.value = code;
  await zoomToAirportByIcao(code);
  fixMobileViewportAfterKeyboard();
  return;
}

if (!ndbLoaded || !ndbVisible) {
  await toggleNdbAirports(button);
}

applyNdbSearch(value);
    });

  } else {
    input.addEventListener("input", function () {
      applyNdbSearch(input.value);
    });

input.addEventListener("keydown", async function (e) {
  if (e.key === "Enter") {
    e.preventDefault();

    const code = input.value.trim().toUpperCase();

    if (/^[A-Z]{4}$/.test(code)) {
      await zoomToAirportByIcao(code);
      fixMobileViewportAfterKeyboard();
      return;
    }

    if (!ndbLoaded || !ndbVisible) {
      await toggleNdbAirports(button);
    }

    applyNdbSearch(input.value);
  }
});
  }

button.addEventListener("click", async function () {
  const code = String(input.value || "")
    .trim()
    .toUpperCase()
    .replace(/[^A-Z0-9]/g, "")
    .slice(0, 4);

  // ICAO 4-letter가 입력되어 있으면 공항으로 zoom-in
  if (/^[A-Z]{4}$/.test(code)) {
    input.value = code;
    await zoomToAirportByIcao(code);
    fixMobileViewportAfterKeyboard();
    return;
  }

  // 4-letter가 아니면 기존 NDB 토글 기능 유지
  await toggleNdbAirports(button);

  if (ndbVisible) {
    applyNdbSearch(input.value);
  }
});

let suppressEnrouteClearUntil = 0;

// 지도 drag/pan 동작은 "빈 곳 클릭"으로 취급하지 않는다.
// 모바일에서 길게 누른 뒤 밀거나, PC에서 pan한 직후 발생할 수 있는 click을 잠시 무시.
map.on("dragstart", function () {
  suppressEnrouteClearUntil = Date.now() + 1000;
});

map.on("dragend", function () {
  suppressEnrouteClearUntil = Date.now() + 350;
});

map.on("click", function () {
  if (Date.now() < suppressEnrouteClearUntil) {
    return;
  }

  // 실제 빈 곳 단순 클릭/탭일 때만 모든 우측 선택 음영 + En Route 강조 해제
  clearSelectedEnrouteEvent();
  clearRightPanelSelections();

  if (selectedIdent) {
    clearSelectedArtcc();
  }
});

document.addEventListener("click", function (e) {
  // 지도 drag/pan 직후 발생하는 click은 선택 해제로 처리하지 않음.
  if (Date.now() < suppressEnrouteClearUntil) return;

  const target = e && e.target;

  if (target && target.closest) {
    // 지도 내부 클릭은 Leaflet의 map/layer handler가 선택/해제를 전담한다.
    // 특히 En Route SVG polygon 클릭 직후 document click이 선택을 다시 지우는 것을 방지.
    if (target.closest("#map")) return;

    // 우측 선택 항목 자체는 각 전용 handler에서 선택 상태를 처리.
    if (target.closest("[data-enroute-key]")) return;
    if (target.closest("[data-advn]")) return;
    if (target.closest("[data-airport-code]")) return;
  }

  if (
    selectedEnrouteEventKey ||
    selectedAdvisoryAdvn ||
    selectedAirportCode
  ) {
    clearSelectedEnrouteEvent();
    clearRightPanelSelections();
  }
});

if (window.visualViewport) {
  window.visualViewport.addEventListener("resize", fixMobileViewportAfterKeyboard);
  window.visualViewport.addEventListener("scroll", fixMobileViewportAfterKeyboard);
}

window.addEventListener("resize", fixMobileViewportAfterKeyboard);
window.addEventListener("orientationchange", function () {
  setTimeout(fixMobileViewportAfterKeyboard, 500);
});

let ARTCC_APP_STARTED = false;

function startArtccAppAfterAuth() {
  if (ARTCC_APP_STARTED) return;
  ARTCC_APP_STARTED = true;

  const authScreen = document.getElementById("authScreen");
  const appRoot = document.getElementById("appRoot");

  if (authScreen) authScreen.style.display = "none";
  if (appRoot) appRoot.style.display = "block";

  setDefaultAdvisoryDate();
  updateFaaLink();
  initNdbFixedControl();

  // En Route Event(FCAP/FCA 등)는 issue되면 시작 전에도 미리 표시하되,
  // End Time이 지나면 새로고침을 기다리지 않고 화면에서 제거한다.
  // 네트워크 호출 없이 메모리 데이터만 30초마다 정리한다.
  setInterval(function () {
    pruneExpiredEnrouteEvents();
  }, 30 * 1000);

  setTimeout(function () {
    if (map && map.invalidateSize) {
      map.invalidateSize(true);
    }
  }, 100);

  loadArtccGeojson()
    .then(() => {
      if (map && map.invalidateSize) {
        map.invalidateSize(true);
      }

      loadAllAdvisoriesForDate();
      autoLoadRouteFromUrl();

      if (window.innerWidth <= 767) {
        showMobilePanel("airports");
      }
    })
    .catch(err => {
      console.error(err);
      alert("ARTCC GeoJSON 로드 실패: " + err.message);
    });
}

(function waitForPortalAuth() {
  if (window.CURRENT_PORTAL_USER) {
    startArtccAppAfterAuth();
    return;
  }

  setTimeout(waitForPortalAuth, 200);
})();
