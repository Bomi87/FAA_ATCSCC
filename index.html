<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>FAA ARTCC Advisory Map</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    html, body, #map {
      margin: 0;
      width: 100%;
      height: 100%;
    }

    .panel {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 999;
      background: white;
      padding: 10px;
      border-radius: 10px;
      box-shadow: 0 2px 12px rgba(0,0,0,.25);
      font-size: 12px;
      width: 280px;
      max-height: 80vh;
      overflow: auto;
    }

    .artcc-label {
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      color: white;
      font-size: 12px;
      font-weight: 700;
      text-shadow:
        -1px -1px 0 #000,
         1px -1px 0 #000,
        -1px  1px 0 #000,
         1px  1px 0 #000;
    }

    .advisory-item {
      border-top: 1px solid #ddd;
      padding: 8px 0;
    }
  </style>
</head>

<body>
  <div class="panel">
    <b>FAA ARTCC Advisory Map</b><br><br>

    <label>Date</label><br>
    <input id="dateInput" type="date" value="2026-05-08" style="width:100%;" />

    <br><br>
    <div>Selected ARTCC: <b id="selectedFacility">-</b></div>

    <br>
    <div id="advisoryList">구역을 클릭하세요.</div>
  </div>

  <div id="map"></div>

  <script>
    const map = L.map("map").setView([39.5, -98.5], 4);

    L.tileLayer(
      "https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png",
      {
        maxZoom: 10,
        attribution: "&copy; OpenStreetMap &copy; CARTO"
      }
    ).addTo(map);

    const artccLayer = L.featureGroup().addTo(map);

    function getArtccStyle(selected) {
      return {
        color: selected ? "#ff3333" : "#666666",
        weight: selected ? 3 : 1.5,
        opacity: 0.9,
        fillColor: selected ? "#ff3333" : "#999999",
        fillOpacity: selected ? 0.14 : 0.05
      };
    }

    async function loadArtcc() {
      const res = await fetch("artcc.geojson?v=" + Date.now(), {
        cache: "no-store"
      });

      if (!res.ok) {
        throw new Error("artcc.geojson load failed");
      }

      const data = await res.json();

      const geo = L.geoJSON(data, {
        style: () => getArtccStyle(false),

        onEachFeature: function(feature, layer) {
          const p = feature.properties || {};
          const ident = p.ident || p.facility || p.id || "";
          const name = p.name || ident;

          layer.bindTooltip(ident, {
            permanent: true,
            direction: "center",
            className: "artcc-label"
          });

          layer.bindPopup(`<b>${ident}</b><br>${name}`);

          layer.on("click", function() {
            artccLayer.eachLayer(function(group) {
              if (group.eachLayer) {
                group.eachLayer(function(l) {
                  if (l.setStyle) l.setStyle(getArtccStyle(false));
                });
              }
            });

            layer.setStyle(getArtccStyle(true));
            selectFacility(ident);
          });
        }
      });

      geo.addTo(artccLayer);
      map.fitBounds(geo.getBounds(), { padding: [20, 20] });
    }

    function selectFacility(ident) {
      document.getElementById("selectedFacility").textContent = ident;
      loadAdvisoriesForFacility(ident);
    }

    async function loadAdvisoriesForFacility(ident) {
      const date = document.getElementById("dateInput").value;
      const box = document.getElementById("advisoryList");

      box.innerHTML = "조회 중...";

      /*
        다음 단계에서 Apps Script Web App URL 연결:
        const API_URL = "https://script.google.com/macros/s/XXXX/exec";
        const url = API_URL + "?date=" + date + "&facility=" + ident;
      */

      box.innerHTML = `
        <div class="advisory-item">
          <b>${ident}</b> / ${date}<br>
          여기에 FAA Advisory 조회 결과 표시 예정
        </div>
      `;
    }

    loadArtcc().catch(err => {
      console.error(err);
      alert(err.message);
    });
  </script>
</body>
</html>
