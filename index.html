<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>FAA ARTCC Advisory Map</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    .top-panel {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 1000;
      width: 310px;
      max-width: calc(100vw - 24px);
      background: rgba(255, 255, 255, 0.96);
      border-radius: 12px;
      box-shadow: 0 3px 14px rgba(0,0,0,0.25);
      padding: 12px;
      font-size: 12px;
    }

    .title {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 10px;
      color: #111827;
    }

    .row {
      margin-bottom: 8px;
    }

    label {
      font-weight: 700;
      display: block;
      margin-bottom: 4px;
      color: #374151;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 7px 8px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 12px;
    }

    .selected-box {
      background: #f3f4f6;
      border-radius: 8px;
      padding: 8px;
      margin-top: 8px;
      line-height: 1.5;
    }

    .btn {
      display: block;
      width: 100%;
      box-sizing: border-box;
      margin-top: 8px;
      padding: 8px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
    }

    .btn:hover {
      background: #1d4ed8;
    }

    .hint {
      color: #6b7280;
      font-size: 11px;
      margin-top: 8px;
      line-height: 1.4;
    }

    .artcc-label {
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      color: #ffffff;
      font-size: 12px;
      font-weight: 700;
      text-shadow:
        -1px -1px 0 #000,
         1px -1px 0 #000,
        -1px  1px 0 #000,
         1px  1px 0 #000,
         0 0 4px rgba(0,0,0,0.8);
    }

    .leaflet-popup-content {
      font-size: 12px;
      line-height: 1.4;
    }

    @media (max-width: 767px) {
      .top-panel {
        width: 270px;
        font-size: 11px;
      }

      .title {
        font-size: 14px;
      }

      .artcc-label {
        font-size: 10px;
      }
    }
  </style>
</head>

<body>
  <div class="top-panel">
    <div class="title">FAA ARTCC Advisory Map</div>

    <div class="row">
      <label for="dateInput">Advisory Date</label>
      <input id="dateInput" type="date" value="2026-05-08" />
    </div>

    <div class="selected-box">
      Selected ARTCC: <b id="selectedArtcc">-</b><br>
      Name: <span id="selectedName">-</span>
    </div>

    <a id="faaListLink" class="btn" href="#" target="_blank">
      Open FAA Advisory List
    </a>

    <div class="hint">
      ARTCC 구역을 클릭하면 해당 날짜 FAA Advisory List 링크가 생성됨.<br>
      다음 단계에서 Apps Script를 붙이면 클릭한 구역 관련 Advisory만 자동 필터링 가능.
    </div>
  </div>

  <div id="map"></div>

  <script>
    const map = L.map("map", {
      zoomControl: true,
      preferCanvas: true
    }).setView([39.5, -98.5], 4);

    const streetMap = L.tileLayer(
      "https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png",
      {
        maxZoom: 12,
        attribution: "&copy; OpenStreetMap &copy; CARTO"
      }
    ).addTo(map);

    const satelliteMap = L.tileLayer(
      "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
      {
        maxZoom: 12,
        attribution: "Tiles &copy; Esri"
      }
    );

    L.control.layers(
      {
        "Street Map": streetMap,
        "Satellite": satelliteMap
      },
      null,
      {
        position: "topright",
        collapsed: false
      }
    ).addTo(map);

    const artccGroup = L.featureGroup().addTo(map);
    let selectedLayer = null;
    let selectedIdent = "";

    function getDateValue() {
      return document.getElementById("dateInput").value || "2026-05-08";
    }

    function buildFaaAdvisoryListUrl(date) {
      return (
        "https://www.fly.faa.gov/adv/adv_list" +
        "?advisoryCategory=All" +
        "&whichAdvisories=Both" +
        "&date=" + encodeURIComponent(date) +
        "&airflow=true&_airflow=on" +
        "&ctop=true&_ctop=on" +
        "&gStop=true&_gStop=on" +
        "&gDelay=true&_gDelay=on" +
        "&route=true&_route=on" +
        "&other=true&_other=on"
      );
    }

    function getArtccStyle(isSelected) {
      return {
        color: isSelected ? "#ef4444" : "#6b7280",
        weight: isSelected ? 3 : 1.5,
        opacity: 0.95,
        fillColor: isSelected ? "#ef4444" : "#64748b",
        fillOpacity: isSelected ? 0.18 : 0.06
      };
    }

    function updateFaaLink() {
      const date = getDateValue();
      const link = document.getElementById("faaListLink");
      link.href = buildFaaAdvisoryListUrl(date);

      if (selectedIdent) {
        link.textContent = "Open FAA List - " + selectedIdent;
      } else {
        link.textContent = "Open FAA Advisory List";
      }
    }

    function selectArtcc(layer, feature) {
      const p = feature.properties || {};
      const ident = p.ident || p.facility || p.id || "";
      const name = p.name || ident;

      if (selectedLayer && selectedLayer.setStyle) {
        selectedLayer.setStyle(getArtccStyle(false));
      }

      selectedLayer = layer;
      selectedIdent = ident;

      layer.setStyle(getArtccStyle(true));
      layer.bringToFront();

      document.getElementById("selectedArtcc").textContent = ident || "-";
      document.getElementById("selectedName").textContent = name || "-";

      updateFaaLink();
    }

    async function loadArtccGeojson() {
      const res = await fetch("artcc.geojson?v=" + Date.now(), {
        cache: "no-store"
      });

      if (!res.ok) {
        throw new Error("artcc.geojson load failed");
      }

      const data = await res.json();

      const geoLayer = L.geoJSON(data, {
        style: function () {
          return getArtccStyle(false);
        },

        onEachFeature: function (feature, layer) {
          const p = feature.properties || {};
          const ident = p.ident || p.facility || p.id || "";
          const name = p.name || ident;

          layer.bindTooltip(ident, {
            permanent: true,
            direction: "center",
            className: "artcc-label",
            opacity: 1
          });

          layer.bindPopup(
            "<b>" + ident + "</b><br>" +
            name + "<br><br>" +
            "Click area to select."
          );

          layer.on("click", function () {
            selectArtcc(layer, feature);
          });

          layer.on("mouseover", function () {
            if (layer !== selectedLayer) {
              layer.setStyle({
                weight: 2.5,
                fillOpacity: 0.12
              });
            }
          });

          layer.on("mouseout", function () {
            if (layer !== selectedLayer) {
              layer.setStyle(getArtccStyle(false));
            }
          });
        }
      });

      geoLayer.addTo(artccGroup);

      const bounds = geoLayer.getBounds();
      if (bounds.isValid()) {
        map.fitBounds(bounds, { padding: [20, 20] });
      }
    }

    document.getElementById("dateInput").addEventListener("change", updateFaaLink);

    updateFaaLink();

    loadArtccGeojson().catch(err => {
      console.error(err);
      alert("ARTCC GeoJSON 로드 실패: " + err.message);
    });
  </script>
</body>
</html>
